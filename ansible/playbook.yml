---
# ── Play 1: Install Jenkins and Java on ci-master ───────
- name: Configure ci-master
  hosts: ci_master
  become: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Java 17
      apt:
        name: openjdk-17-jdk
        state: present

    - name: Install Git and curl
      apt:
        name: [git, curl, gnupg, apt-transport-https]
        state: present

    - name: Download Jenkins key
      shell: |
        curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key \
        -o /usr/share/keyrings/jenkins-keyring.asc
        chmod 644 /usr/share/keyrings/jenkins-keyring.asc
      args:
        creates: /usr/share/keyrings/jenkins-keyring.asc

    - name: Add Jenkins repository
      copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/\n"

    - name: Install Jenkins
      apt:
        name: jenkins
        update_cache: yes
        state: present

    - name: Start and enable Jenkins
      systemd:
        name: jenkins
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Wait for Jenkins port 8080
      wait_for:
        host: localhost
        port: 8080
        delay: 15
        timeout: 120

    - name: Get Jenkins initial password
      command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_pass

    - name: Show Jenkins password
      debug:
        msg: "Jenkins password: {{ jenkins_pass.stdout }}"

# ── Play 2: Install Docker and Java on ci-agent ─────────
- name: Configure ci-agent
  hosts: ci_agent
  become: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Java 17
      apt:
        name: openjdk-17-jdk
        state: present

    - name: Install prerequisites
      apt:
        name: [curl, gnupg, apt-transport-https, ca-certificates]
        state: present

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
        chmod 644 /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Get Ubuntu codename
      command: lsb_release -cs
      register: codename

    - name: Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ codename.stdout }} stable\n"

    - name: Install Docker CE
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        update_cache: yes
        state: present

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Start and enable Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Verify Docker
      command: docker --version
      register: docker_ver

    - name: Show Docker version
      debug:
        msg: "{{ docker_ver.stdout }}"

# ── Play 3: Verify all services ─────────────────────────
- name: Verify all services
  hosts: all
  become: true

  tasks:

    - name: Check Jenkins on ci-master
      systemd:
        name: jenkins
      register: jenkins_status
      when: inventory_hostname in groups['ci_master']

    - name: Show Jenkins status
      debug:
        msg: "Jenkins is {{ jenkins_status.status.ActiveState }}"
      when: inventory_hostname in groups['ci_master']

    - name: Check Docker on ci-agent
      command: docker ps
      register: docker_status
      when: inventory_hostname in groups['ci_agent']

    - name: Show Docker status
      debug:
        msg: "{{ docker_status.stdout }}"
      when: inventory_hostname in groups['ci_agent']
